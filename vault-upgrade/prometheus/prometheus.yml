---
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: vault
    static_configs:
      - targets:
          - vault-1:8200
          - vault-2:8200
          - vault-3:8200
        labels:
          __metrics_path__: '/v1/sys/metrics'

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
